name: Checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m ruff check app tests migrations
      - run: python -m ruff format --check app tests migrations
      - run: python -m mypy app
      - run: python -m pytest -q
      - run: python -m alembic upgrade head --sql
      - name: Check worker imports without starting a worker
        run: python -c "from app.tasks.celery_app import celery_app; assert celery_app.conf.accept_content == ['json']"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-docs.mjs
      - name: Validate Compose without starting containers
        run: docker compose --env-file .env.example --profile app config --quiet
