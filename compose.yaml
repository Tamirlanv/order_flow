# Local development only. Published ports bind to loopback.
name: orderflow

x-app-environment: &app-environment
  APP_ENV: development
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-orderflow}
  POSTGRES_USER: ${POSTGRES_USER:-orderflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-orderflow}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
  OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:?Set OUTBOX_ENCRYPTION_KEY in .env}
  IDEMPOTENCY_ENCRYPTION_KEY: ${IDEMPOTENCY_ENCRYPTION_KEY:?Set IDEMPOTENCY_ENCRYPTION_KEY in .env}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: noreply@orderflow.local
  STORAGE_ROOT: /var/lib/orderflow/files

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  mailpit:
    condition: service_started

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Cache/rate limits only; loss of Redis must not lose orders or jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: orderflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"

  api:
    profiles: ["app"]
    image: orderflow-backend:local
    build:
      context: ./backend
      target: runtime
    environment: *app-environment
    depends_on: *app-dependencies
    volumes:
      - files_data:/var/lib/orderflow/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true

  worker:
    profiles: ["app"]
    image: orderflow-backend:local
    build:
      context: ./backend
      target: runtime
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on: *app-dependencies
    volumes:
      - files_data:/var/lib/orderflow/files
    init: true
    stop_grace_period: 45s

  beat:
    profiles: ["app"]
    image: orderflow-backend:local
    build:
      context: ./backend
      target: runtime
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-environment
    depends_on: *app-dependencies
    init: true

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *app-environment
      RUN_INTEGRATION: "1"
      INTEGRATION_API_URL: http://api:8000
      INTEGRATION_WEB_URL: http://frontend
      MAILPIT_API_URL: http://mailpit:8025
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      worker:
        condition: service_started
    command: ["python", "-m", "pytest", "-q"]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  files_data:
