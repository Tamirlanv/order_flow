# http context; shared by the HTTP development and opt-in HTTPS servers.
server_tokens off;
map $scheme $orderflow_hsts {
    default "";
    https "max-age=31536000";
}
log_format orderflow escape=json
    '{"request_id":"$request_id","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
include /etc/nginx/orderflow/server.conf;
