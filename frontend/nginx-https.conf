# Local TLS only. A public deployment requires its own hostname/certificate.
server {
    listen 80;
    server_name _;
    include /etc/nginx/orderflow/security.conf;
    return 308 https://localhost:8443$request_uri;
}
server {
    listen 443 ssl;
    server_name localhost frontend;
    ssl_certificate /etc/orderflow/tls/cert.pem;
    ssl_certificate_key /etc/orderflow/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    include /etc/nginx/orderflow/security.conf;
    include /etc/nginx/orderflow/routes.conf;
}
